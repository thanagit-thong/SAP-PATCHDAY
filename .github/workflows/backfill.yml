name: SAP Security Patch Day Backfill

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Start month, YYYY-MM"
        required: true
        default: "2025-01"
        type: string
      to:
        description: "End month, YYYY-MM"
        required: true
        default: "2026-09"
        type: string
      overwrite:
        description: "Overwrite existing JSON files"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill SAP Patch Day history
        run: |
          python -m src.backfill \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}" \
            ${{ inputs.overwrite && '--overwrite' || '' }}

      - name: Commit historical JSON
        run: |
          git config user.name "sap-patchday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- doc/patchday/; then
            echo "No changes to commit."
            exit 0
          fi

          git add doc/patchday/
          git commit -m "chore: backfill SAP Security Patch Day history"
          git push
